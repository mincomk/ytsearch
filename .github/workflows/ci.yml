name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (all features)
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Clippy (async only)
        run: cargo clippy --no-default-features --features async --all-targets -- -D warnings

      - name: Test (all features)
        run: cargo test --all-features

      - name: Test (blocking only)
        run: cargo test --no-default-features --features blocking

      - name: Test (async only)
        run: cargo test --no-default-features --features async

  publish-to-crates-io:
    name: Publish to crates.io
    # only on tag pushes, and only after the tests pass
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/ytsearch
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # needs the CARGO_REGISTRY_TOKEN secret (a crates.io API token)
      - name: Publish
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
